server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El resolver y el backend se inyectan via variable de entorno BACKEND_URL:
    #   DEV  → http://credit-orchestrator:8080  (Docker Compose)
    #   PROD → https://<url-railway>             (Railway env var)
    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;

    # Proxy al Orquestador para evitar CORS
    location /api/ {
        set $backend ${BACKEND_URL};
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Angular SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
