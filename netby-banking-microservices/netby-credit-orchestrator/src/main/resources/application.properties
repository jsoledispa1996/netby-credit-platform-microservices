# ============================================================
#  Netby Credit Orchestrator - Configuración Común
#  Aplicada en todos los perfiles (dev, prod)
# ============================================================

quarkus.application.name=netby-credit-orchestrator
quarkus.http.port=8080

# gRPC - servidor en puerto distinto para evitar conflicto con risk-service
quarkus.grpc.server.port=9001
quarkus.grpc.clients.risk-service.host=${RISK_SERVICE_HOST:localhost}
quarkus.grpc.clients.risk-service.port=${RISK_SERVICE_GRPC_PORT:9000}

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.exposed-headers=Content-Type
quarkus.http.cors.access-control-max-age=24H

