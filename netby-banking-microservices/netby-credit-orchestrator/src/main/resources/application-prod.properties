# ============================================================
#  Netby Credit Orchestrator - Perfil Producción (prod)
#  Activo en build de producción: mvn package -Dquarkus.profile=prod
# ============================================================

# PostgreSQL - Variables de entorno requeridas en producción
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

# Hibernate ORM - Sin auto-update en producción (usar migraciones)
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# Logging mínimo en producción
quarkus.log.level=INFO
quarkus.log.category."com.netby.banking".level=INFO
