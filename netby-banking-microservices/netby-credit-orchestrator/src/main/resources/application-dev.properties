# PostgreSQL - Base de datos local
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=banco
quarkus.datasource.password=bancopass
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/creditdb

# Hibernate ORM - Auto-update en desarrollo
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# Logging detallado en desarrollo
quarkus.log.level=DEBUG
quarkus.log.category."com.netby.banking".level=DEBUG
